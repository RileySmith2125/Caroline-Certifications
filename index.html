<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caroline Cert Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">Cert Practice</span>
      <span class="right muted mono">local-only · <span id="picker-date"></span></span>
    </header>
    <main class="view picker">
      <div class="eyebrow">Choose an exam</div>
      <h1>Pick an exam</h1>
      <p class="lede muted">
        Each exam has its own pool, progress, and spaced-repetition queue.
      </p>
      <div id="exam-cards" class="exam-picker">
        <div class="loading">Loading exams…</div>
      </div>
      <p class="muted mono picker-hint">? Add a new exam by dropping a bundle in <code>/data</code>.</p>
    </main>
    <script type="module" src="js/picker.js"></script>
  </body>
</html>
